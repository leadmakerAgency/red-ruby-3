# Eleventy (11ty) → static HTML only. This repo is NOT Jekyll; GitHub must never
# run Jekyll on the Eleventy source on branch "main".
#
# REQUIRED one-time setup (Repository → Settings → Pages → Build and deployment):
#   • Source: Deploy from a branch
#   • Branch: gh-pages  ← NOT main
#   • Folder: / (root)
#
# If the publishing branch is "main", GitHub runs "pages build and deployment"
# with Jekyll on .md / .njk source and the build fails (Liquid vs Nunjucks).
# This workflow pushes only the contents of ./_site (HTML, assets) to gh-pages
# and the action adds .nojekyll so Pages serves files as static assets.
#
name: Build and deploy (Eleventy → gh-pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: test -f _site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true

backend:
  name: github
  # TODO: replace with your actual GitHub repo, e.g. "your-username/red-ruby"
  repo: your-username/red-ruby

media_folder: "content/media"
public_folder: "/media"

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: "content/posts"
    create: true
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly slug, e.g. airbnb-cleaning-cambridge" }
      - { label: "Publish Date", name: "date", widget: "datetime", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on the blog list and in SEO." }
      - { label: "Hero Emoji", name: "hero_emoji", widget: "string", required: false, hint: "Optional emoji used in the blog card thumbnail." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }


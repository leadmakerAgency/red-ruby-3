[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Contact form: Formspree — in the Formspree dashboard add every public host (e.g. redrubycleaningco.co.uk and *.workers.dev / Pages previews) under form settings if “Restrict to domain” is enabled, or emails will not be sent.
